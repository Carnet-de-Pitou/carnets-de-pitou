name: Feature share text

on:
  push:
    branches:
      - feature-share-text

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Add share button and copy behavior
        run: |
          python - <<'PY'
          from pathlib import Path
          idx=Path('index.html')
          s=idx.read_text(encoding='utf-8')
          old='<div class="reader-nav"><button id="prevText">← Texte précédent</button><button id="backShelf">Retour aux Carnets</button><button id="nextText">Texte suivant →</button></div>'
          new='<div class="reader-nav"><button id="prevText">← Texte précédent</button><button id="backShelf">Retour aux Carnets</button><button id="shareText" type="button">Partager</button><button id="nextText">Texte suivant →</button></div>'
          if old not in s: raise SystemExit('Bloc reader-nav attendu introuvable')
          s=s.replace(old,new,1)
          idx.write_text(s,encoding='utf-8')

          app=Path('app.js')
          a=app.read_text(encoding='utf-8')
          needle="document.getElementById('prevText').onclick=()=>currentIndex>0&&openText(currentNavList[currentIndex-1].slug);document.getElementById('nextText').onclick=()=>currentIndex>=0&&currentIndex<currentNavList.length-1&&openText(currentNavList[currentIndex+1].slug);"
          repl="document.getElementById('prevText').onclick=()=>currentIndex>0&&openText(currentNavList[currentIndex-1].slug);const shareBtn=document.getElementById('shareText');if(shareBtn)shareBtn.onclick=async()=>{if(currentIndex<0||!currentNavList[currentIndex])return;const t=currentNavList[currentIndex],url=new URL('textes/'+encodeURIComponent(t.slug)+'.html',document.baseURI).href,old=shareBtn.textContent;try{await navigator.clipboard.writeText(url);shareBtn.textContent='Lien copié';shareBtn.title=url}catch(e){const ta=document.createElement('textarea');ta.value=url;ta.setAttribute('readonly','');ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove();shareBtn.textContent='Lien copié';shareBtn.title=url}setTimeout(()=>{shareBtn.textContent=old},1800)};document.getElementById('nextText').onclick=()=>currentIndex>=0&&currentIndex<currentNavList.length-1&&openText(currentNavList[currentIndex+1].slug);"
          if needle not in a: raise SystemExit('Bloc navigation app.js attendu introuvable')
          a=a.replace(needle,repl,1)
          app.write_text(a,encoding='utf-8')
          PY
      - name: Validate no unrelated UI/content changes
        run: |
          test "$(git diff --name-only | sort | tr '\n' ' ')" = "app.js index.html "
          grep -q 'id="shareText"' index.html
          grep -q "new URL('textes/'" app.js
          grep -q "navigator.clipboard.writeText" app.js
          test "$(git diff -- app.js index.html | grep '^[-+].*reader-nav' | wc -l)" -eq 2
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js index.html
          git commit -m "Ajouter le partage par URL des textes"
          git push origin HEAD:feature-share-text
