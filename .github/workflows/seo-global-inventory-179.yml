name: SEO Global Inventory 179

on:
  push:
    branches:
      - seo-global-inventory-179

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: seo-global-inventory-179
      - name: Locate remaining texts
        run: |
          node <<'NODE'
          const fs=require('fs'),vm=require('vm');
          function inspectFile(f){
            const b={window:{}}; b.window.window=b.window; vm.createContext(b);
            try{vm.runInContext(fs.readFileSync(f,'utf8'),b,{timeout:30000});}catch(e){console.log('LOADERR',f,e.message);return []}
            console.log('SOURCE',f);
            const out=[];
            for(const [k,v] of Object.entries(b.window)){
              if(Array.isArray(v)){
                console.log('ARRAY',k,v.length);
                for(const x of v) if(x&&x.slug) out.push(x);
              }
            }
            return out;
          }
          const named=[];
          for(const f of ['library-baseline-20260822.js','library-archive.js','data.js','library.js','library-items.js']){
            if(fs.existsSync(f)) for(const x of inspectFile(f)) named.push([f,x]);
          }
          const union=new Map();
          for(const [f,x] of named){if(!union.has(x.slug)) union.set(x.slug,{item:x,sources:[f]});else union.get(x.slug).sources.push(f)}
          console.log('NAMED_UNION',union.size);
          const individual=[];
          for(const f of fs.readdirSync('texts').filter(f=>f.endsWith('.js'))){
            const b={window:{}};b.window.window=b.window;vm.createContext(b);
            try{vm.runInContext(fs.readFileSync('texts/'+f,'utf8'),b,{timeout:5000});}catch(e){continue}
            const x=b.window.PITOU_LIBRARY_ITEM;
            if(x&&x.slug) individual.push(x);
          }
          console.log('INDIVIDUAL_PARSED',individual.length);
          const extras=[];
          for(const x of individual){if(!union.has(x.slug)){extras.push(x);union.set(x.slug,{item:x,sources:['individual']})}}
          console.log('INDIVIDUAL_EXTRAS',extras.length);
          for(const x of extras) console.log('EXTRA',x.category,'\t',x.slug,'\t',x.title);
          console.log('FINAL_UNION_WITH_INDIVIDUAL',union.size);
          const counts=new Map();
          for(const {item} of union.values()){const c=String(item.category||'').trim()||'(sans categorie)';counts.set(c,(counts.get(c)||0)+1)}
          console.log('FINAL_CATEGORIES');
          for(const [c,n] of [...counts.entries()].sort((a,b)=>a[0].localeCompare(b[0],'fr'))) console.log(`${n}\t${c}`);
          NODE
