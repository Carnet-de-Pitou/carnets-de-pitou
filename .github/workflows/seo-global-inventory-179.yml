name: SEO Global Inventory 179

on:
  push:
    branches:
      - seo-global-inventory-179

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: seo-global-inventory-179
      - name: Inventory baseline and current sources
        run: |
          node <<'NODE'
          const fs=require('fs'),vm=require('vm');
          function load(f){
            const b={window:{}}; b.window.window=b.window; vm.createContext(b);
            vm.runInContext(fs.readFileSync(f,'utf8'),b,{timeout:30000});
            for(const k of ['PITOU_PUBLIC_LIBRARY','TEXTS']) if(Array.isArray(b.window[k])) return b.window[k];
            return [];
          }
          const baseline=load('library-baseline-20260822.js');
          const archive=load('library-archive.js');
          console.log('BASELINE_TOTAL',baseline.length);
          console.log('ARCHIVE_TOTAL',archive.length);
          const counts=new Map();
          for(const x of baseline){const c=String(x&&x.category||'').trim()||'(sans categorie)';counts.set(c,(counts.get(c)||0)+1)}
          console.log('BASELINE_CATEGORIES');
          for(const [c,n] of [...counts.entries()].sort((a,b)=>a[0].localeCompare(b[0],'fr'))) console.log(`${n}\t${c}`);
          const slugs=baseline.map(x=>x&&x.slug).filter(Boolean);
          console.log('BASELINE_UNIQUE_SLUGS',new Set(slugs).size);
          const dup=[...new Set(slugs.filter((s,i)=>slugs.indexOf(s)!==i))];
          console.log('DUPLICATE_SLUGS',dup.length,dup.join(','));
          const textFiles=fs.existsSync('texts')?fs.readdirSync('texts').filter(f=>f.endsWith('.js')):[];
          console.log('INDIVIDUAL_JS_COUNT',textFiles.length);
          const present=new Set(textFiles.map(f=>f.replace(/\.js$/,'')));
          const missing=baseline.filter(x=>x&&x.slug&&!present.has(x.slug));
          console.log('MISSING_FROM_TEXTS',missing.length);
          const missCounts=new Map();
          for(const x of missing){const c=String(x.category||'').trim()||'(sans categorie)';missCounts.set(c,(missCounts.get(c)||0)+1)}
          console.log('MISSING_BY_CATEGORY');
          for(const [c,n] of [...missCounts.entries()].sort((a,b)=>a[0].localeCompare(b[0],'fr'))) console.log(`${n}\t${c}`);
          NODE
