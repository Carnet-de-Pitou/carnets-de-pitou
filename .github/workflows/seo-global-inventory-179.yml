name: SEO Global Inventory 179

on:
  push:
    branches:
      - seo-global-inventory-179

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: seo-global-inventory-179
      - name: Inventory complete union
        run: |
          node <<'NODE'
          const fs=require('fs'),vm=require('vm');
          function load(f){
            const b={window:{}}; b.window.window=b.window; vm.createContext(b);
            vm.runInContext(fs.readFileSync(f,'utf8'),b,{timeout:30000});
            for(const k of ['PITOU_PUBLIC_LIBRARY','TEXTS']) if(Array.isArray(b.window[k])) return b.window[k];
            return [];
          }
          const sources=[
            ['baseline',load('library-baseline-20260822.js')],
            ['archive',load('library-archive.js')],
            ['data',load('data.js')]
          ];
          for(const [name,arr] of sources) console.log('SOURCE_TOTAL',name,arr.length);
          const bySlug=new Map();
          for(const [name,arr] of sources){
            for(const x of arr){
              if(!x||!x.slug) continue;
              if(!bySlug.has(x.slug)) bySlug.set(x.slug,{item:x,sources:[name]});
              else bySlug.get(x.slug).sources.push(name);
            }
          }
          console.log('UNION_UNIQUE_SLUGS',bySlug.size);
          const counts=new Map();
          for(const {item} of bySlug.values()){
            const c=String(item.category||'').trim()||'(sans categorie)';
            counts.set(c,(counts.get(c)||0)+1);
          }
          console.log('UNION_CATEGORIES');
          for(const [c,n] of [...counts.entries()].sort((a,b)=>a[0].localeCompare(b[0],'fr'))) console.log(`${n}\t${c}`);
          const textFiles=fs.existsSync('texts')?fs.readdirSync('texts').filter(f=>f.endsWith('.js')):[];
          const present=new Set(textFiles.map(f=>f.replace(/\.js$/,'')));
          const missing=[...bySlug.values()].map(v=>v.item).filter(x=>!present.has(x.slug));
          console.log('INDIVIDUAL_JS_COUNT',textFiles.length);
          console.log('MISSING_UNION_FROM_TEXTS',missing.length);
          const missCounts=new Map();
          for(const x of missing){const c=String(x.category||'').trim()||'(sans categorie)';missCounts.set(c,(missCounts.get(c)||0)+1)}
          console.log('MISSING_UNION_BY_CATEGORY');
          for(const [c,n] of [...missCounts.entries()].sort((a,b)=>a[0].localeCompare(b[0],'fr'))) console.log(`${n}\t${c}`);
          console.log('MISSING_SLUGS');
          for(const x of missing.sort((a,b)=>String(a.category).localeCompare(String(b.category),'fr')||String(a.title).localeCompare(String(b.title),'fr'))) console.log(`${x.category}\t${x.slug}\t${x.title}`);
          NODE
