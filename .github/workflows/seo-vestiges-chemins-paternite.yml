name: SEO Vestiges Chemins Paternite

on:
  push:
    branches:
      - seo-vestiges-chemins-paternite

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: seo-vestiges-chemins-paternite
      - name: Complete Chemins de la Paternite
        run: |
          node <<'NODE'
          const fs=require('fs'),vm=require('vm');
          const b={window:{}};b.window.window=b.window;vm.createContext(b);
          vm.runInContext(fs.readFileSync('library.js','utf8'),b,{timeout:30000});
          const category='Les Chemins de la Paternité ~~ Tera';
          const items=(b.window.PITOU_PUBLIC_LIBRARY||[]).filter(x=>x&&x.category===category);
          if(items.length!==1) throw new Error(`Dans library.js attendu 1, trouve ${items.length}`);
          const item=items[0];
          console.log(`${item.slug} :: ${item.title}`);
          const p=`texts/${item.slug}.js`;
          if(fs.existsSync(p)) { console.log('ALREADY_EXISTS'); process.exit(0); }
          if(typeof item.html!=='string'||!item.html.length) throw new Error(`Texte invalide ${item.slug}`);
          fs.writeFileSync(p,`window.PITOU_LIBRARY_ITEM = ${JSON.stringify(item)};\n`,'utf8');
          NODE
      - name: Commit if needed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add texts/*.js
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "SEO Vestiges: completer Les Chemins de la Paternité"
          git push origin HEAD:seo-vestiges-chemins-paternite
