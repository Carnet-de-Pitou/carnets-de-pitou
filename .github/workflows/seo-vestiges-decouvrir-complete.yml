name: SEO Vestiges Decouvrir complete

on:
  push:
    branches:
      - seo-vestiges-decouvrir-complete

permissions:
  contents: write

jobs:
  complete:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: seo-vestiges-decouvrir-complete
      - name: Extract complete Decouvrir series
        run: |
          node <<'NODE'
          const fs=require('fs'),vm=require('vm');
          const category='Découvrir le monde ~~ Lineage 2, Hypérion';
          const load=f=>{const b={window:{}};b.window.window=b.window;vm.createContext(b);vm.runInContext(fs.readFileSync(f,'utf8'),b,{timeout:20000});return b.window.PITOU_PUBLIC_LIBRARY||[]};
          const baseline=load('library-baseline-20260822.js').filter(x=>x&&x.category===category);
          const archive=load('library-archive.js').filter(x=>x&&x.category===category);
          const bySlug=new Map();
          for(const x of baseline) bySlug.set(x.slug,x);
          for(const x of archive) bySlug.set(x.slug,x);
          const items=[...bySlug.values()];
          if(items.length!==23) throw new Error(`Nombre attendu 23, trouve ${items.length}`);
          console.log('DECOUVRIR TOTAL',items.length);
          for(const item of items){
            if(!item.slug||typeof item.html!=='string'||!item.html.length) throw new Error(`Texte invalide ${item.slug}`);
            console.log(`${item.slug} :: ${item.title}`);
            const p=`texts/${item.slug}.js`;
            if(fs.existsSync(p) && item.slug==='o-liberte') continue;
            fs.writeFileSync(p,`window.PITOU_LIBRARY_ITEM = ${JSON.stringify(item)};\n`,'utf8');
          }
          NODE
      - name: Commit missing Decouvrir items
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add texts/*.js
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "SEO Vestiges: completer Decouvrir le monde"
          git push origin HEAD:seo-vestiges-decouvrir-complete
