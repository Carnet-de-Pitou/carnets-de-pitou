name: SEO Vestiges Decouvrir preparation

on:
  push:
    branches:
      - seo-vestiges-decouvrir

permissions:
  contents: write

jobs:
  individualize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: seo-vestiges-decouvrir
      - name: Extract Decouvrir le monde
        run: |
          node <<'NODE'
          const fs=require('fs'),vm=require('vm');
          const box={window:{}};vm.createContext(box);vm.runInContext(fs.readFileSync('library-archive.js','utf8'),box);
          const category='Découvrir le monde ~~ Lineage 2, Hypérion';
          const items=(box.window.PITOU_PUBLIC_LIBRARY||[]).filter(x=>x&&x.category===category);
          if(items.length!==1) throw new Error(`Nombre inattendu: ${items.length}`);
          for(const item of items){
            if(!item.slug||typeof item.html!=='string'||!item.html.length) throw new Error('Texte invalide');
            console.log(`${item.slug} :: ${item.title}`);
            fs.writeFileSync(`texts/${item.slug}.js`,`window.PITOU_LIBRARY_ITEM = ${JSON.stringify(item)};\n`,'utf8');
          }
          NODE
      - name: Commit generated item
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add texts/*.js
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "SEO Vestiges: individualiser Découvrir le monde"
          git push origin HEAD:seo-vestiges-decouvrir
