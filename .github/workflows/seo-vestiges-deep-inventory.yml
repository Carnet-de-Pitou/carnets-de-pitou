name: SEO Vestiges deep inventory

on:
  push:
    branches:
      - seo-vestiges-deep-inventory

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: seo-vestiges-deep-inventory
      - name: Reproduce real site merge
        run: |
          node <<'NODE'
          const fs=require('fs'),vm=require('vm');
          const run=file=>{const box={window:{}};box.window.window=box.window;vm.createContext(box);vm.runInContext(fs.readFileSync(file,'utf8'),box,{timeout:30000});return box.window};
          const d=run('data.js');
          let merged=[];
          for(const file of ['library-archive.js','library-baseline-20260822.js','library.js']){
            const w=run(file); const arr=w.PITOU_PUBLIC_LIBRARY||[];
            const m=new Map(merged.map(t=>[t.slug,t])); for(const t of arr) if(t&&t.slug)m.set(t.slug,t); merged=[...m.values()];
            console.log(`${file}: ${arr.length} items; merged=${merged.length}`);
          }
          const m=new Map((d.TEXTS||[]).map(t=>[t.slug,t])); for(const t of merged) if(t&&t.slug)m.set(t.slug,{...(m.get(t.slug)||{}),...t});
          const texts=[...m.values()];
          const parent='Découvrir le monde ~~ Lineage 2, Hypérion';
          const pattern=/^Découvrir le monde\s+(?:[IVXLCDM]+|\d+)$/i;
          const all=texts.filter(t=>t.category===parent);
          const series=all.filter(t=>pattern.test((t.title||'').trim()));
          const general=all.filter(t=>!pattern.test((t.title||'').trim()));
          console.log(`TOTAL parent=${all.length}`);
          console.log(`SERIES=${series.length}`);
          for(const t of series) console.log(`SERIES\t${t.slug}\t${t.title}\t${t.date||''}`);
          console.log(`GENERAL=${general.length}`);
          for(const t of general) console.log(`GENERAL\t${t.slug}\t${t.title}\t${t.date||''}`);
          console.log('VESTIGES GROUPS',JSON.stringify(d.CATEGORY_GROUPS&&d.CATEGORY_GROUPS['Vestiges Rôleplay']||[]));
          NODE
