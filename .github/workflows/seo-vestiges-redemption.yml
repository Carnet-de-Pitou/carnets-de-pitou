name: SEO Vestiges Redemption preparation

on:
  push:
    branches:
      - seo-vestiges-redemption

permissions:
  contents: write

jobs:
  individualize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: seo-vestiges-redemption
      - name: Extract Redemption Althea
        run: |
          node <<'NODE'
          const fs=require('fs'),vm=require('vm');
          const box={window:{}};vm.createContext(box);vm.runInContext(fs.readFileSync('library-archive.js','utf8'),box);
          const category='La rédemption sur Althéa ~~ The Four Coming (T4C)';
          const items=(box.window.PITOU_PUBLIC_LIBRARY||[]).filter(x=>x&&x.category===category);
          if(items.length!==7) throw new Error(`Nombre inattendu: ${items.length}`);
          console.log('REDEMPTION');
          for(const item of items){
            if(!item.slug||typeof item.html!=='string'||!item.html.length) throw new Error(`Texte invalide: ${item.slug}`);
            console.log(`${item.slug} :: ${item.title}`);
            fs.writeFileSync(`texts/${item.slug}.js`,`window.PITOU_LIBRARY_ITEM = ${JSON.stringify(item)};\n`,'utf8');
          }
          NODE
      - name: Commit generated items
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add texts/*.js
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "SEO Vestiges: individualiser La rédemption sur Althéa"
          git push origin HEAD:seo-vestiges-redemption
