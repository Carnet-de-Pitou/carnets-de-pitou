name: SEO Vestiges Sentiers Foi

on:
  push:
    branches:
      - seo-vestiges-sentiers-foi

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: seo-vestiges-sentiers-foi
      - name: Extract Sentiers de la Foi
        run: |
          node <<'NODE'
          const fs=require('fs'),vm=require('vm');
          const b={window:{}};b.window.window=b.window;vm.createContext(b);
          vm.runInContext(fs.readFileSync('library-baseline-20260822.js','utf8'),b,{timeout:20000});
          const category='Les Sentiers de la Foi ~~ World of Warcraft';
          const items=(b.window.PITOU_PUBLIC_LIBRARY||[]).filter(x=>x&&x.category===category);
          if(items.length!==4) throw new Error(`Attendu 4, trouve ${items.length}`);
          for(const item of items){
            if(!item.slug||typeof item.html!=='string'||!item.html.length) throw new Error(`Texte invalide ${item.slug}`);
            console.log(`${item.slug} :: ${item.title}`);
            const p=`texts/${item.slug}.js`;
            if(fs.existsSync(p)) throw new Error(`Conflit existant ${p}`);
            fs.writeFileSync(p,`window.PITOU_LIBRARY_ITEM = ${JSON.stringify(item)};\n`,'utf8');
          }
          NODE
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add texts/*.js
          git commit -m "SEO Vestiges: individualiser Les Sentiers de la Foi"
          git push origin HEAD:seo-vestiges-sentiers-foi
