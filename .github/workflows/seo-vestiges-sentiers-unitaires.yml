name: SEO Vestiges Sentiers unitaires

on:
  push:
    branches:
      - seo-vestiges-sentiers-unitaires

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: seo-vestiges-sentiers-unitaires
      - name: Extract unitary Sentiers
        run: |
          node <<'NODE'
          const fs=require('fs'),vm=require('vm');
          const b={window:{}};b.window.window=b.window;vm.createContext(b);
          vm.runInContext(fs.readFileSync('library-baseline-20260822.js','utf8'),b,{timeout:20000});
          const categories=[
            'Les Sentiers de la Sollitude ~~ Age of Conan',
            'Les Sentiers de la Spiritualité ~~ Lineage 2, Hérésie'
          ];
          for(const category of categories){
            const items=(b.window.PITOU_PUBLIC_LIBRARY||[]).filter(x=>x&&x.category===category);
            if(items.length!==1) throw new Error(`${category}: attendu 1, trouve ${items.length}`);
            const item=items[0];
            const p=`texts/${item.slug}.js`;
            if(fs.existsSync(p)) throw new Error(`Conflit existant ${p}`);
            if(typeof item.html!=='string'||!item.html.length) throw new Error(`Texte invalide ${item.slug}`);
            console.log(`${category} :: ${item.slug} :: ${item.title}`);
            fs.writeFileSync(p,`window.PITOU_LIBRARY_ITEM = ${JSON.stringify(item)};\n`,'utf8');
          }
          NODE
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add texts/*.js
          git commit -m "SEO Vestiges: individualiser Sollitude et Spiritualité"
          git push origin HEAD:seo-vestiges-sentiers-unitaires
