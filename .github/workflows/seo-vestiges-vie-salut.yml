name: SEO Vestiges Vie Salut

on:
  push:
    branches:
      - seo-vestiges-vie-salut

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: seo-vestiges-vie-salut
      - name: Extract Vie and Salut
        run: |
          node <<'NODE'
          const fs=require('fs'),vm=require('vm');
          const b={window:{}};b.window.window=b.window;vm.createContext(b);
          vm.runInContext(fs.readFileSync('library.js','utf8'),b,{timeout:30000});
          const arr=b.window.PITOU_PUBLIC_LIBRARY||[];
          const categories=new Map([
            ['Les Sentiers de la Vie ~~ World of Warcraft, Sentinelles',1],
            ['Les Sentiers du Salut ~~ Rift',2]
          ]);
          let total=0;
          for(const [category,expected] of categories){
            const items=arr.filter(x=>x&&x.category===category);
            if(items.length!==expected) throw new Error(`${category}: attendu ${expected}, trouve ${items.length}`);
            for(const item of items){
              const p=`texts/${item.slug}.js`;
              if(fs.existsSync(p)) throw new Error(`Conflit existant ${p}`);
              if(typeof item.html!=='string'||!item.html.length) throw new Error(`Texte invalide ${item.slug}`);
              console.log(`${category} :: ${item.slug} :: ${item.title}`);
              fs.writeFileSync(p,`window.PITOU_LIBRARY_ITEM = ${JSON.stringify(item)};\n`,'utf8');
              total++;
            }
          }
          if(total!==3) throw new Error(`Total inattendu ${total}`);
          NODE
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add texts/*.js
          git commit -m "SEO Vestiges: individualiser Sentiers de la Vie et du Salut"
          git push origin HEAD:seo-vestiges-vie-salut
